[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barbershop-autotrack"
version = "0.1.0"
description = "Offline sung barbershop learning tracks from MusicXML"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Evan Huus"}]
dependencies = ["numpy>=1.26.4,<3", "scipy>=1.15.3,<2", "soundfile>=0.13.1,<1", "music21>=10.5,<11", "cmudict>=1.1,<2"]

[project.optional-dependencies]
singer = [
    "numpy<2",
    "torch==2.2.0",
    "torchaudio==2.2.0",
    "transformers==4.41.2",
    "accelerate==1.11.0",
    "omegaconf==2.3.0",
    "librosa==0.11.0",
]

[project.urls]
Repository = "https://github.com/eapache/autotrack"
Issues = "https://github.com/eapache/autotrack/issues"

[project.scripts]
autotrack = "autotrack.__main__:main"

[tool.setuptools.packages.find]
include = ["autotrack*"]
